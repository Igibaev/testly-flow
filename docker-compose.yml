services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-testly_flow}
      POSTGRES_USER: ${POSTGRES_USER:-testly_flow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-testly_flow}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-testly_flow} -d ${POSTGRES_DB:-testly_flow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-testly_flow}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-testly_flow}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-testly_flow}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
