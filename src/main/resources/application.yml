server:
  port: 8080

spring:
  application:
    name: testly-flow-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/testly_flow}
    username: ${SPRING_DATASOURCE_USERNAME:testly_flow}
    password: ${SPRING_DATASOURCE_PASSWORD:testly_flow}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  admin:
    password: ${ADMIN_PASSWORD:admin}

testly:
  sampling:
    questions-per-category-min: ${TESTLY_QUESTIONS_PER_CATEGORY_MIN:10}
    questions-per-category-max: ${TESTLY_QUESTIONS_PER_CATEGORY_MAX:15}
    shuffle-questions: ${TESTLY_SHUFFLE_QUESTIONS:false}
  metrics:
    min-samples: ${TESTLY_METRICS_MIN_SAMPLES:5}
  timing:
    max-time-spent-ms: ${TESTLY_MAX_TIME_SPENT_MS:21600000}
    suspicious-overrun-ratio: ${TESTLY_SUSPICIOUS_OVERRUN_RATIO:0.10}
  feedback:
    tier-thresholds:
      solid: ${TESTLY_TIER_SOLID:50}
      strong: ${TESTLY_TIER_STRONG:75}
      exemplary: ${TESTLY_TIER_EXEMPLARY:90}
