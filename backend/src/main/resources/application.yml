server:
  port: 8080

spring:
  application:
    name: testly-flow-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/testly_flow}
    username: ${SPRING_DATASOURCE_USERNAME:testly_flow}
    password: ${SPRING_DATASOURCE_PASSWORD:testly_flow}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  admin:
    password: ${ADMIN_PASSWORD:admin}
