# Motivating post-test feedback copy, kept out of Java code so it can be edited by
# non-programmers. Tone: supportive and specific, no condescension, no false enthusiasm,
# "ты"-form, colleague to colleague. Each tier has several variants so the phrase does not
# feel scripted on repeat attempts.
growth:
  headlines:
    - "Есть с чем поработать"
    - "Хорошая стартовая точка"
    - "Карта пробелов готова"
  messages:
    - "Это нормальный результат для начала. Главное — теперь у тебя есть точная карта: вот эти блоки стоит разобрать, и следующая попытка будет другой."
    - "Провал — это не приговор, а список того, что стоит подтянуть. Пройдись по материалам ниже и возвращайся: результат точно изменится."
    - "Сейчас видно, где именно не хватает уверенности. Это уже половина дела — осталось закрыть конкретные пробелы, а не гадать, что учить."
solid:
  headlines:
    - "Уверенная база"
    - "Хорошая опора"
    - "Есть куда расти"
  messages:
    - "База уверенная. Два блока ниже остальных — добери их, и результат станет сильным."
    - "Основа держится хорошо. Если подтянуть отстающие блоки, результат перейдёт в разряд сильных."
    - "Ты явно ориентируешься в материале. Осталось доработать конкретные темы — и будет полная уверенность."
strong:
  headlines:
    - "Сильный результат"
    - "Материал держишь хорошо"
    - "Заметный уровень"
  messages:
    - "Сильный результат. Ты хорошо держишь материал."
    - "Видно, что материал усвоен основательно. Пара тем — и будет полный порядок."
    - "Хороший уровень владения темой. Дальше — только шлифовка отдельных деталей."
exemplary:
  headlines:
    - "Отличный результат"
    - "Эталонный уровень"
    - "Высший класс"
  messages:
    - "Отличный результат — на таких, как ты, команда и держится. Коллеги могут приходить к тебе с вопросами."
    - "Материал усвоен на отличном уровне. Это тот случай, когда тебя стоит звать на помощь другим."
    - "Впечатляющий результат. Ты один из тех, кто задаёт планку для команды."
